basePath: /
definitions:
  http.AddCommentRequest:
    properties:
      content:
        type: string
    type: object
  http.AssigneeStatResponse:
    properties:
      count:
        type: integer
      user_id:
        type: string
    type: object
  http.ChangeRoleRequest:
    properties:
      role:
        type: string
    type: object
  http.CreateTaskRequest:
    properties:
      description:
        type: string
      team_id:
        type: string
      title:
        type: string
    type: object
  http.CreateTeamRequest:
    properties:
      name:
        type: string
    type: object
  http.InviteMemberRequest:
    properties:
      role:
        type: string
      user_id:
        type: string
    type: object
  http.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  http.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  http.TaskCommentResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      task_id:
        type: string
      user_id:
        type: string
    type: object
  http.TaskHistoryResponse:
    properties:
      changed_by:
        type: string
      changes:
        type: string
      created_at:
        type: string
      id:
        type: string
      task_id:
        type: string
    type: object
  http.TaskResponse:
    properties:
      assignee_id:
        type: string
      closed_at:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      status:
        type: string
      team_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  http.TeamResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  http.TeamStatsResponse:
    properties:
      average_close_time_seconds:
        type: number
      tasks_by_status:
        additionalProperties:
          type: integer
        type: object
      top_assignees:
        items:
          $ref: '#/definitions/http.AssigneeStatResponse'
        type: array
      total_comments:
        type: integer
    type: object
  http.UpdateTaskRequest:
    properties:
      assignee_id:
        type: string
      description:
        type: string
      status:
        type: string
      title:
        type: string
      version:
        type: integer
    type: object
  http.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: very cool api.
  title: Task Manager API
  version: "1.0"
paths:
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token.
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: JWT Token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: User login
      tags:
      - Auth
  /api/v1/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with email, password, and name.
      parameters:
      - description: User registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User successfully registered
          schema:
            $ref: '#/definitions/http.UserResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Register a new user
      tags:
      - Auth
  /api/v1/tasks:
    get:
      description: Retrieves tasks for a team with optional filtering and pagination.
      parameters:
      - description: Team ID
        in: query
        name: team_id
        required: true
        type: string
      - default: 20
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Filter by task status
        in: query
        name: status
        type: string
      - description: Filter by assignee ID
        in: query
        name: assignee_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of tasks
          schema:
            items:
              $ref: '#/definitions/http.TaskResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get list of tasks
      tags:
      - Tasks
    post:
      consumes:
      - application/json
      description: Creates a new task within a specific team.
      parameters:
      - description: Task creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Task created
          schema:
            $ref: '#/definitions/http.TaskResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a new task
      tags:
      - Tasks
  /api/v1/tasks/{id}:
    put:
      consumes:
      - application/json
      description: Updates the details of a specific task.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Task update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update an existing task
      tags:
      - Tasks
  /api/v1/tasks/{id}/comments:
    get:
      description: Retrieves all comments for a specific task.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of comments
          schema:
            items:
              $ref: '#/definitions/http.TaskCommentResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get task comments
      tags:
      - Tasks
    post:
      consumes:
      - application/json
      description: Adds a new comment to a specific task.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.AddCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Created comment
          schema:
            $ref: '#/definitions/http.TaskCommentResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Add comment to a task
      tags:
      - Tasks
  /api/v1/tasks/{id}/history:
    get:
      description: Retrieves the history of changes for a specific task.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Task history
          schema:
            items:
              $ref: '#/definitions/http.TaskHistoryResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get task history
      tags:
      - Tasks
  /api/v1/teams:
    get:
      description: Retrieves a list of teams the authenticated user belongs to.
      produces:
      - application/json
      responses:
        "200":
          description: List of teams
          schema:
            items:
              $ref: '#/definitions/http.TeamResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List user teams
      tags:
      - Teams
    post:
      consumes:
      - application/json
      description: Creates a new team for the authenticated user.
      parameters:
      - description: Team creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CreateTeamRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Team created
          schema:
            $ref: '#/definitions/http.TeamResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a new team
      tags:
      - Teams
  /api/v1/teams/{id}/invite:
    post:
      consumes:
      - application/json
      description: Invites another user to the specified team with a specific role.
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: Invitation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.InviteMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Invite a member to a team
      tags:
      - Teams
  /api/v1/teams/{id}/members/{user_id}/role:
    put:
      consumes:
      - application/json
      description: Changes the role of a user within a team.
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: Target User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: New role details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ChangeRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Change team member role
      tags:
      - Teams
  /api/v1/teams/{id}/stats:
    get:
      description: Retrieves statistics for a specific team.
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Team statistics
          schema:
            $ref: '#/definitions/http.TeamStatsResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get team statistics
      tags:
      - Teams
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
